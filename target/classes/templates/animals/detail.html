<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Animal profile')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('animals')}"></header>
<main id="main" class="container page adopt-page">

    <a class="adopt-back" th:href="@{/animals}">← All animals</a>
    <div th:if="${adoptionNotice}" class="alert" role="status" th:text="${adoptionNotice}"></div>
    <div th:if="${adoptionProblem}" class="alert alert-error" role="alert" th:text="${adoptionProblem}"></div>
    <article class="adopt-profile">
        <div class="adopt-profile-picture"><img th:src="@{${animal.imagePath}}" th:alt="|Portrait of ${animal.name}|" width="640" height="640"></div>
        <div class="adopt-profile-text">
            <span class="badge" th:text="${animal.status.label}"></span>
            <h1 th:text="|Meet ${animal.name}|"></h1>
            <p class="adopt-subtitle" th:text="|${animal.breed} · ${animal.ageLabel} · ${animal.sex.label}|"></p>
            <p th:text="${animal.description}"></p>
            <h2>Care &amp; routine</h2>
            <p th:text="${animal.careNotes}"></p>
            <a class="btn btn-primary" th:if="${animal.status.name() == 'AVAILABLE'}" th:href="@{/animals/{id}/apply(id=${animal.id})}" th:text="|Apply to adopt ${animal.name}|"></a>
            <a class="btn btn-secondary" th:unless="${animal.status.name() == 'AVAILABLE'}" th:href="@{/animals(status='AVAILABLE')}">Meet available animals</a>
        </div>
    </article>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
