<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Staff sign in')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('admin')}"></header>
<main id="main" class="container narrow-page page">
    <div class="page-heading"><p class="eyebrow"><span class="rule"></span> Shelter staff</p><h1>Staff sign in</h1><p>Use the local demo account to manage animals, applications and the charity shop.</p></div>
    <form method="post" th:action="@{/login}" class="content-panel form-stack">
        <p th:if="${param.error}" class="alert alert-error" role="alert">The username or password was incorrect. Please try again.</p>
        <div class="form-field"><label for="username">Username</label><input type="text" id="username" name="username" autocomplete="username" required></div>
        <div class="form-field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
        <button type="submit" class="btn btn-primary">Sign in <svg aria-hidden="true" class="icon "><use href="/images/icons.svg#arrow"></use></svg></button>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body></html>
