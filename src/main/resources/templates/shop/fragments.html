<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="notices">
    <p class="alert" role="status" th:if="${shopNotice}" th:text="${shopNotice}"></p>
    <p class="alert alert-error" role="alert" th:if="${shopError}" th:text="${shopError}"></p>
</div>
<div th:fragment="empty(title,copy)" class="market-empty">
    <h2 th:text="${title}"></h2>
    <p th:text="${copy}"></p>
</div>
<dl th:fragment="price(subtotal,discount,wrap,donation,total)" class="price-list">
    <div><dt>Merchandise</dt><dd th:text="${@kzt.format(subtotal)}"></dd></div>
    <div><dt>Promotion</dt><dd th:text="${discount.signum() > 0 ? '−' + @kzt.format(discount) : @kzt.format(discount)}"></dd></div>
    <div><dt>Gift wrapping</dt><dd th:text="${@kzt.format(wrap)}"></dd></div>
    <div><dt>Shelter donation</dt><dd th:text="${@kzt.format(donation)}"></dd></div>
    <div class="price-total"><dt>Total</dt><dd th:text="${@kzt.format(total)}"></dd></div>
</dl>
</body></html>
