<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage animals')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('admin')}"></header>
<main id="main" class="container page adopt-page">

    <nav th:replace="~{fragments/layout :: adminNav('animals')}"></nav>
    <div class="adopt-heading-row"><h1>Animal records</h1><a class="btn btn-primary" th:href="@{/admin/animals/new}">Add an animal</a></div>
    <div th:if="${adoptionNotice}" class="alert" role="status" th:text="${adoptionNotice}"></div>
    <div th:if="${adoptionProblem}" class="alert alert-error" role="alert" th:text="${adoptionProblem}"></div>
    <div class="table-wrap">
        <table>
            <caption class="adopt-visually-hidden">Animals and their availability</caption>
            <thead><tr><th scope="col">Animal</th><th scope="col">Species</th><th scope="col">Age</th><th scope="col">Status</th><th scope="col">Availability</th></tr></thead>
            <tbody>
                <tr th:each="animal : ${animals}">
                    <td><a th:href="@{/animals/{id}(id=${animal.id})}" th:text="${animal.name}"></a></td>
                    <td th:text="${animal.species.label}"></td><td th:text="${animal.ageLabel}"></td>
                    <td><span class="badge" th:text="${animal.status.label}"></span></td>
                    <td>
                        <form method="post" th:unless="${animal.status.name() == 'ADOPTED'}" th:action="@{/admin/animals/{id}/status(id=${animal.id})}">
                            <button class="btn btn-secondary" type="submit" name="status" th:value="${animal.status.name() == 'AVAILABLE' ? 'ON_HOLD' : 'AVAILABLE'}"
                                    th:text="${animal.status.name() == 'AVAILABLE' ? 'Place on hold' : 'Reopen applications'}"></button>
                        </form>
                        <span th:if="${animal.status.name() == 'ADOPTED'}">Placement complete</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
