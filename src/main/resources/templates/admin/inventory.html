<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inventory history')}"><title>Inventory history · PawHaven</title></head>
<body>
<header th:replace="~{fragments/layout :: header('admin')}"></header>
<main class="container page market-page" id="main">
<nav th:replace="~{fragments/layout :: adminNav('inventory')}"></nav>
<div class="market-heading"><div><p class="eyebrow">Administration</p><h1>Inventory history</h1>
        <p>The latest 100 stock changes and low-stock alerts, newest first.</p></div>
        <a th:href="@{/admin/products}" class="btn btn-secondary">Manage stock</a></div>
    <div th:if="${records.isEmpty()}"><div th:replace="~{shop/fragments :: empty('No stock events yet','Complete a shop order or update a product’s stock to see its history.')}"></div></div>
    <div class="table-wrap" th:unless="${records.isEmpty()}"><table>
        <thead><tr><th scope="col">Recorded</th><th scope="col">Product</th><th scope="col">Event</th><th scope="col">Stock</th><th scope="col">Reason</th></tr></thead>
        <tbody><tr th:each="r : ${records}">
            <td th:text="${#temporals.format(r.createdAt,'d MMM, HH:mm')}"></td><th scope="row" th:text="${r.productName}"></th>
            <td><span class="badge" th:classappend="${r.kind.toString() == 'LOW_STOCK' ? 'market-warning' : ''}"
                      th:text="${r.kind.toString() == 'LOW_STOCK' ? 'Low stock' : 'Stock audit'}"></span></td>
            <td th:text="|${r.previousStock} → ${r.newStock}|"></td><td th:text="${r.reason}"></td>
        </tr></tbody>
    </table></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
