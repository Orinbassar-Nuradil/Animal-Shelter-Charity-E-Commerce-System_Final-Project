<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Customer orders')}"><title>Customer orders · PawHaven</title></head>
<body>
<header th:replace="~{fragments/layout :: header('admin')}"></header>
<main class="container page market-page" id="main">
<nav th:replace="~{fragments/layout :: adminNav('orders')}"></nav>
<div class="market-heading"><div><p class="eyebrow">Administration</p><h1>Customer orders</h1>
        <p>Review completed demo purchases and their fulfillment details.</p></div></div>
    <div th:if="${orders.isEmpty()}"><div th:replace="~{shop/fragments :: empty('No orders yet','Completed shop checkouts will appear here.')}"></div></div>
    <div class="admin-order-list">
        <details th:each="o : ${orders}" class="admin-order">
            <summary><strong th:text="|PH-${o.id} · ${o.customerName}|"></strong>
                <span th:text="${#temporals.format(o.createdAt,'d MMM yyyy, HH:mm')}"></span>
                <b th:text="${@kzt.format(o.total)}"></b>
            </summary>
            <div class="admin-order-body">
                <div><h2>Customer</h2><p th:text="${o.email}"></p>
                    <p th:text="${o.fulfillment.name() == 'DELIVERY' ? 'Delivery' : 'Shelter pickup'}"></p>
                    <p th:if="${o.fulfillment.name() == 'DELIVERY'}" th:text="${o.address}"></p>
                    <h2>Items</h2><ul><li th:each="i : ${o.items}" th:text="|${i.quantity} × ${i.productName} · ${@kzt.format(i.subtotal)}|"></li></ul>
                </div><div><h2>Payment summary</h2>
                    <dl th:replace="~{shop/fragments :: price(${o.subtotal},${o.discount},${o.giftWrappingFee},${o.donation},${o.total})}"></dl>
                </div>
            </div>
        </details>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
